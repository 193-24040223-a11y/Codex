<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>버스 3D 시뮬레이션</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: Arial, sans-serif; }
    #app { width: 100%; height: 100%; position: relative; }
    #ui {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      background: rgba(0,0,0,0.6); color: white; padding: 12px; border-radius: 8px;
      display: flex; gap: 8px; align-items: center;
    }
    select, button { padding: 6px 8px; border-radius: 6px; border: none; }
  </style>
</head>
<body>
  <div id="app">
    <div id="ui">
      <label for="bus-select">버스 선택:</label>
      <select id="bus-select"></select>
      <button id="spawn">버스 적용</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.165.0/build/three.module.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.165.0/examples/jsm/controls/OrbitControls.js';

    const app = document.getElementById('app');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(8, 6, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    app.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const light = new THREE.DirectionalLight(0xffffff, 1.2);
    light.position.set(10, 20, 10);
    light.castShadow = true;
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.MeshStandardMaterial({ color: 0x5f9f5f })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const road = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 8),
      new THREE.MeshStandardMaterial({ color: 0x2f2f2f })
    );
    road.rotation.x = -Math.PI / 2;
    road.position.y = 0.01;
    scene.add(road);

    const busOptions = [
      { name: '시내버스 (파랑)', body: 0x2066d1, stripe: 0xffffff },
      { name: '광역버스 (빨강)', body: 0xcf2f2f, stripe: 0xffd4d4 },
      { name: '전기버스 (초록)', body: 0x1f9d55, stripe: 0xcaf7d0 },
    ];

    const busSelect = document.getElementById('bus-select');
    busOptions.forEach((opt, idx) => {
      const option = document.createElement('option');
      option.value = String(idx);
      option.textContent = opt.name;
      busSelect.appendChild(option);
    });

    let activeBus;
    function createBus({ body, stripe }) {
      const group = new THREE.Group();

      const busBody = new THREE.Mesh(
        new THREE.BoxGeometry(4, 1.5, 1.8),
        new THREE.MeshStandardMaterial({ color: body })
      );
      busBody.position.y = 1.3;
      busBody.castShadow = true;
      group.add(busBody);

      const stripeMesh = new THREE.Mesh(
        new THREE.BoxGeometry(4.05, 0.25, 1.81),
        new THREE.MeshStandardMaterial({ color: stripe })
      );
      stripeMesh.position.set(0, 1.1, 0);
      group.add(stripeMesh);

      const roof = new THREE.Mesh(
        new THREE.BoxGeometry(2.8, 0.6, 1.6),
        new THREE.MeshStandardMaterial({ color: 0xe8f0ff })
      );
      roof.position.y = 2.2;
      roof.castShadow = true;
      group.add(roof);

      const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.3, 24);
      const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
      [[-1.3,0.6,1], [1.3,0.6,1], [-1.3,0.6,-1], [1.3,0.6,-1]].forEach(([x, y, z]) => {
        const wheel = new THREE.Mesh(wheelGeo, wheelMat);
        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(x, y, z * 0.75);
        wheel.castShadow = true;
        group.add(wheel);
      });

      group.position.y = 0.1;
      return group;
    }

    function setBus(index) {
      if (activeBus) scene.remove(activeBus);
      activeBus = createBus(busOptions[index]);
      scene.add(activeBus);
    }

    setBus(0);

    document.getElementById('spawn').addEventListener('click', () => {
      setBus(Number(busSelect.value));
    });

    let speed = 0.04;
    let direction = 1;

    function animate() {
      requestAnimationFrame(animate);
      if (activeBus) {
        activeBus.position.x += speed * direction;
        if (activeBus.position.x > 40) direction = -1;
        if (activeBus.position.x < -40) direction = 1;
        activeBus.rotation.y = direction === 1 ? 0 : Math.PI;
      }
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
